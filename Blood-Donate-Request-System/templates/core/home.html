{% extends "base.html" %}

{% block content %}
<section class="hero py-5">
    <div class="container text-center">
        <h1>Blood Donate & Request</h1>
        <p class="lead">Find a donor. Save a life.</p>
        <a class="btn btn-light btn-lg m-1" href="{% url 'donor_list' %}">Find Blood Donor</a>
        <a class="btn btn-outline-light btn-lg m-1" href="{% url 'request_create' %}">Request Blood</a>
        <a class="btn btn-outline-light btn-lg m-1" href="{% url 'donor_create' %}">Become a Donor</a>
    </div>
</section>
<div class="container py-5">
    <div class="row g-4 text-center">
        <div class="col-md-6"><div class="card p-4">
            <h2>{{ donor_count }}</h2>
            <p>Available Donors</p>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-4">
            <h2>{{ request_count }}</h2>
            <p>Pending Requests</p>
        </div>
    </div>
    </div>
</div>
{% endblock %}
