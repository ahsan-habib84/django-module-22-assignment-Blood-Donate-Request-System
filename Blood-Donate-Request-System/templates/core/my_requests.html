{% extends "base.html" %}{% block content %}<div class="container py-5"><h2>My Requests</h2><div class="row g-3">{% for r in requests %}<div class="col-md-6"><div class="card p-3"><h5>{{ r.patient_name }} — {{ r.blood_group }}</h5><p>{{ r.hospital_name }}, {{ r.location }}</p><p>{{ r.required_date }} | {{ r.status }}</p><a class="btn btn-sm btn-outline-danger" href="{% url 'request_detail' r.pk %}">Details</a> <a class="btn btn-sm btn-warning" href="{% url 'request_edit' r.pk %}">Edit</a></div></div>{% empty %}<p>You have no blood requests.</p>{% endfor %}</div></div>{% endblock %}
