<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Blood Donate & Request{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f8f9fa}.hero{background:#dc3545;color:white;border-radius:0 0 30px 30px}.card{box-shadow:0 2px 10px #0001}.brand{font-weight:700}</style>
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark"><div class="container">
<a class="navbar-brand brand" href="{% url 'home' %}">🩸 Blood Donate</a>
<div class="navbar-nav ms-auto">
<a class="nav-link" href="{% url 'donor_list' %}">Find Donors</a><a class="nav-link" href="{% url 'request_list' %}">Blood Requests</a>
{% if user.is_authenticated %}<a class="nav-link" href="{% url 'request_create' %}">Create Request</a><a class="nav-link" href="{% url 'my_requests' %}">My Requests</a><a class="nav-link" href="{% url 'profile' %}">Profile</a>
<form action="{% url 'logout' %}" method="post" class="d-inline">{% csrf_token %}<button class="btn btn-link nav-link">Logout</button></form>
{% else %}<a class="nav-link" href="{% url 'login' %}">Login</a><a class="nav-link" href="{% url 'register' %}">Register</a>{% endif %}
</div></div></nav>
{% for message in messages %}<div class="container mt-3"><div class="alert alert-success">{{ message }}</div></div>{% endfor %}
{% block content %}{% endblock %}
<footer class="text-center py-4 mt-5 text-muted">Blood Donate & Request System</footer>
</body></html>
